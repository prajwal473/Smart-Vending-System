spring.application.name=medicine-vending-web

# MySQL Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/medicine_vending
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}

# JPA Configuration
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
# Keep each request from sharing a stale JPA session; purchases always read fresh rows under a lock.
spring.jpa.open-in-view=false

# Thymeleaf
spring.thymeleaf.cache=false

# Web Server
server.port=8080

# --- Stage 5: administrator account (NEVER put real values in this file) ---
# Supply credentials through environment variables. If they are missing, admin login is simply disabled;
# there is no default account. Use ADMIN_PASSWORD (hashed with BCrypt in memory at startup)
# or ADMIN_PASSWORD_HASH (a ready-made BCrypt hash, preferred).
app.admin.username=${ADMIN_USERNAME:}
app.admin.password=${ADMIN_PASSWORD:}
app.admin.password-hash=${ADMIN_PASSWORD_HASH:}

# --- Stage 5B: dashboard settings ---
app.dashboard.low-stock-threshold=${LOW_STOCK_THRESHOLD:5}
app.dashboard.expiry-warning-days=30
app.dashboard.list-limit=50
app.dashboard.recent-transactions=10

# Session cookie hardening
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
